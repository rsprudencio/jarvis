[project]
name = "jarvis-obsidian"
version = "1.0.1"
description = "Jarvis Obsidian MCP Server - Git audit trail and PKM vault operations"
requires-python = ">=3.11"
dependencies = [
    "jarvis-common",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
jarvis-obsidian = "server:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
jarvis-common = { path = "../../../lib/jarvis-common" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
