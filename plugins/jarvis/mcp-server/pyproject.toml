[project]
name = "jarvis-core"
version = "3.7.0"
description = "Jarvis Tools MCP Server - Git and vault operations for JARVIS protocol"
requires-python = ">=3.11"
dependencies = [
    "jarvis-common",
    "mcp>=1.0.0,<2.0.0",
    "tokenizers>=0.13.0",
    "sentence-transformers[onnx]>=3.0.0",
    "onnxruntime>=1.17.0",
    "psycopg[pool]>=3.1.0",
    "pgvector>=0.3.0",
]

[tool.uv.sources]
jarvis-common = { path = "../../../lib/jarvis-common" }

[project.optional-dependencies]
bedrock = [
    "boto3>=1.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Prebuilt libpq so tests run without a system PostgreSQL install.
    "psycopg[binary]>=3.1.0",
]
# Retrieval benchmark (bench/). Heavy, and NOT shipped in the Docker image —
# torch and the MTEB dataset suite are only needed to evaluate candidate models.
# mteb pulls pytrec-eval-terrier, which compiles C++ (needs a toolchain).
bench = [
    "mteb>=2.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "scipy>=1.11.0",
]

[project.scripts]
jarvis-core = "server:main_sync"
jarvis-init-db = "bin.init_db:main"
jarvis-generate-summaries = "bin.generate_summaries:main"
jarvis-reindex-embeddings = "bin.reindex_embeddings:main"
jarvis-setup-replication = "bin.setup_replication:main"
jarvis-upgrade-embedding = "bin.upgrade_embedding_model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: End-to-end tests against real PostgreSQL (require E2E_POSTGRES_URL)",
]
